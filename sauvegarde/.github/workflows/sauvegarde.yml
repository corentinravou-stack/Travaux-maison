# Sauvegarde automatique, chaque nuit vers 3 h 17 (heure de Paris en hiver).
# Ce fichier va dans le dépôt PRIVÉ de sauvegarde, pas dans celui de l'application.
name: Sauvegarde quotidienne

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger les données
        run: node sauvegarder.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sauvegardes
          git diff --cached --quiet || git commit -m "Sauvegarde du $(date +%F)"
          git push
